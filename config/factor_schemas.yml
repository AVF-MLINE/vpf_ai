        source_path: pallesthesiometry.upper_limbs_score
        normalized_key: pallesthesiometry_upper_limbs
        code: plh
        type: float
        required: false
      - group: pallesthesiometry
        source_path: pallesthesiometry.lower_limbs_score
        normalized_key: pallesthesiometry_lower_limbs
        code: plf
        type: float
        required: false
      - group: thermometry
        source_path: thermometry.upper_limbs_delta_c
        normalized_key: thermometry_upper_limbs
        code: tmh
        type: float
        required: false
        units: "C"
      - group: thermometry
        source_path: thermometry.lower_limbs_delta_c
        normalized_key: thermometry_lower_limbs
