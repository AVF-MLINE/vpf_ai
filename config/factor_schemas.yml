        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: neurological_exam
        source_path: general_neurological_examinations.brush_pastiness
        normalized_key: brush_pastiness
        code: bps
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: neurological_exam
