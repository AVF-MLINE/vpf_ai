factors:
  vbo:
    title: "Вибрационная болезнь общая"
    labels: ["I", "II", "III", "IV"]
    task_description: >
      Ты строгий медицинский классификатор для ВБО. На вход приходит обезличенный
      компактный payload. Верни только одну метку риска из списка I, II, III, IV.
      Учитывай стаж контакта, условия труда, жалобы, неврологический осмотр,
      сопутствующие заболевания, а также дополнительные показатели паллестезиометрии
      и термометрии, если они есть. Не выдумывай отсутствующие данные.
    metadata_fields:
      - source_path: algorithm.group
        normalized_key: algorithm_group
        code: alg
        type: enum
        required: false
        enum_values: { I: "I", II: "II", III: "III", IV: "IV" }
      - source_path: worker.sex
        normalized_key: sex
        code: sx
        type: enum
        required: false
        enum_values: { m: "male", f: "female", "1": "male", "0": "female" }
      - source_path: worker.age
        normalized_key: age
        code: age
        type: integer
        required: false
        units: "years"
      - source_path: worker.contact_years
        normalized_key: contact_years
        code: cty
        type: integer
        required: true
        units: "years"
      - source_path: work_conditions.harm_class
        normalized_key: harm_class
        code: whc
        type: string
        required: true
      - source_path: work_conditions.exposure_score
        normalized_key: exposure_score
        code: exp
        type: float
        required: false
    fields:
      - group: complaints
        source_path: general_neurological_examinations.pain_syndrome_h
        normalized_key: pain_upper_limbs
        code: psh
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: complaints
        source_path: general_neurological_examinations.pain_syndrome_f
        normalized_key: pain_lower_limbs
        code: psf
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: complaints
        source_path: general_neurological_examinations.complaint_h
        normalized_key: paresthesia_upper_limbs
        code: cph
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: complaints
        source_path: general_neurological_examinations.complaint_f
        normalized_key: paresthesia_lower_limbs
        code: cpf
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: complaints
        source_path: general_neurological_examinations.brush_chilliness
        normalized_key: chilliness_hands
        code: bch
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: complaints
        source_path: general_neurological_examinations.feet_chilliness
        normalized_key: chilliness_feet
        code: fch
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: complaints
        source_path: general_neurological_examinations.angiospasm_h
        normalized_key: hand_angiospasm
        code: ash
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: neurological_exam
        source_path: general_neurological_examinations.brush_color
        normalized_key: brush_color
        code: bcl
        type: enum
        required: true
        enum_values:
          "0": "Обычный окрас"
          "1": "Мраморный окрас"
          "2": "Мраморно-цианотичный / цианотичный окрас"
      - group: neurological_exam
        source_path: general_neurological_examinations.foot_color
        normalized_key: foot_color
        code: fcl
        type: enum
        required: true
        enum_values:
          "0": "Обычный окрас"
          "1": "Мраморный окрас"
          "2": "Мраморно-цианотичный / цианотичный окрас"
      - group: neurological_exam
        source_path: general_neurological_examinations.hyperhidrosis_palms
        normalized_key: hyperhidrosis_palms
        code: hhp
        type: enum
        required: false
        enum_values: { "0": "Нет", "1": "Есть" }
      - group: neurological_exam
        source_path: general_neurological_examinations.hyperhidrosis_foot
        normalized_key: hyperhidrosis_foot
